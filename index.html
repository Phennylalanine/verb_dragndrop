<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- Makes the page look good on phones and tablets -->
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Verb Match Game</title>

  <!-- Link to the main design / style file -->
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- ==================================================
       TOP STATUS BAR (HUD)
       Shows level, XP, combo, and timer
       ================================================== -->
  <div id="gameHUD" class="hud">

    <!-- Player level display -->
    <div class="hud-section">
      <span class="hud-label">LEVEL</span>
      <span id="levelDisplay" class="hud-value">1</span>
    </div>

    <!-- XP (experience points) bar and numbers -->
    <div class="hud-section xp-area">
      <span class="hud-label">XP</span>

      <!-- Background of XP bar -->
      <div class="xp-bar-bg">
        <!-- Filled part of XP bar -->
        <div id="xpBar" class="xp-bar"></div>
      </div>

      <!-- XP numbers (current / needed) -->
      <span id="xpText" class="hud-value small">0 / 100</span>
    </div>

    <!-- Combo counter (streak of correct answers) -->
    <div class="hud-section">
      <span class="hud-label">COMBO</span>
      <span id="comboDisplay" class="combo-value">x1</span>
    </div>

    <!-- Timer and best time -->
    <div class="hud-section">
      <span class="hud-label">TIME</span>
      <span id="timerDisplay" class="hud-value">0.0s</span>

      <span class="hud-label small">BEST</span>
      <span id="bestTimeDisplay" class="hud-value small">--</span>
    </div>

  </div>

  <!-- ==================================================
       LEVEL UP POPUP
       Appears when player gains a level
       ================================================== -->
  <div id="levelUpPopup" class="popup">LEVEL UP!</div>


  <!-- ==================================================
       HEADER AREA
       Title + control buttons
       ================================================== -->
  <header class="app-header">

    <!-- Game title -->
    <h1>Verb Match: JP → EN</h1>

    <!-- Reset button and score display -->
    <div class="controls">

      <!-- Restart the game -->
      <button id="resetBtn" class="btn">Reset</button>

      <!-- (Optional) Reveal answers button
           Not used in single-verb mode, but kept for safety -->
      <button id="revealBtn" class="btn">Reveal</button>

      <!-- Shows progress: correct / total -->
      <span id="score" class="score">0 / 0</span>

    </div>
  </header>


  <!-- ==================================================
       MAIN GAME AREA
       ================================================== -->
  <main class="layout">

    <!-- ================================================
         LEFT SIDE: MAIN GAME BOARD
         ================================================ -->
    <section class="board">

      <!-- Shows the current Japanese verb and tense -->
      <div id="verbPrompt" class="verb-prompt">
        Loading...
      </div>

      <!-- Big drop area where student drops the answer -->
      <div id="answerZone" class="dropzone big">
        Drop the correct verb here
      </div>

    </section>


    <!-- ================================================
         RIGHT SIDE: TILE TRAY
         ================================================ -->
    <aside class="tray">

      <!-- Section title -->
      <h2 class="tray-title">Answer Choices</h2>

      <!-- Area that holds draggable word tiles -->
      <div id="tileBank" class="tile-bank"></div>

    </aside>

  </main>


  <!-- ==================================================
       MAIN GAME LOGIC
       Loads the JavaScript file
       ================================================== -->
  <script src="app.js" defer></script>

</body>
</html>
